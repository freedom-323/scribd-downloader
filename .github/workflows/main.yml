name: Scribd Downloader

on:
  workflow_dispatch:
    inputs:
      scribd_url:
        description: 'Scribd Document URL'
        required: true
      utc_offset:
        description: 'Timezone offset in hours: +/-n(.5) (e.g., +8, -5, +5.5, 0)'
        required: true
        default: '+8'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Parse URL and Calculate Timestamp
        env:
          RAW_URL: ${{ github.event.inputs.scribd_url }}
          UTC_OFFSET: ${{ github.event.inputs.utc_offset }}
        run: |
          node -e '
            const fs = require("fs");

            // 1. Extract numeric ID after /document/
            const urlMatch = (process.env.RAW_URL || "").match(/scribd\.com\/document\/(\d+)/);
            if (!urlMatch) {
              console.error("Error: Invalid Scribd URL");
              process.exit(1);
            }
            const embedUrl = "https://scribd.com" + urlMatch[1] + "/content";

            // 2. Parse +/-n(.5) offset and format timestamp
            const rawOffset = (process.env.UTC_OFFSET || "0").replace(/^(GMT|UTC)/i, "").trim();
            if (!/^[+-]?\d+(\.5)?$/.test(rawOffset)) {
              console.error("Error: Invalid offset format. Use +/-n or +/-n.5");
              process.exit(1);
            }
            const d = new Date(Date.now() + parseFloat(rawOffset) * 3600000);
            const p = n => String(n).padStart(2, "0");
            const stamp = `${p(d.getUTCDate())}/${p(d.getUTCMonth()+1)}/${d.getUTCFullYear()} (${p(d.getUTCHours())}:${p(d.getUTCMinutes())})`;

            const releaseTitle = "Release " + stamp;
            const outFile = (releaseTitle + ".html").replace(/[/:]/g, "-");

            // 3. Export variables safely to GitHub Actions environment
            fs.appendFileSync(process.env.GITHUB_ENV,
              `EMBED_URL=${embedUrl}\nRELEASE_TITLE=${releaseTitle}\nOUT_FILE=${outFile}\n`
            );
          '

      - name: Download Single-File HTML
        run: |
          echo "Fetching: $EMBED_URL"
          echo "Release Title: $RELEASE_TITLE"
          echo "Output File: $OUT_FILE"

          npx --yes single-file-cli "$EMBED_URL" "$OUT_FILE" \
            --browser-executable-path=/usr/bin/google-chrome \
            --browser-args='["--no-sandbox"]' \
            --load-deferred-images=true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_URL: ${{ github.event.inputs.scribd_url }}
        run: |
          gh release create "release-${{ github.run_id }}" \
            "$OUT_FILE" \
            --title "${RELEASE_TITLE}" \
            --notes "Archived from: ${RAW_URL}"
