name: Scribd Downloader

on:
  workflow_dispatch:
    inputs:
      scribd_url:
        description: 'Scribd Document URL'
        required: true
      utc_offset:
        description: 'Timezone offset in hours: +/-n(.5) (e.g., +8, -5, +5.5, 0)'
        required: true
        default: '+8'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Calculate Timestamp and Save Single-File HTML
        env:
          RAW_URL: ${{ github.event.inputs.scribd_url }}
          UTC_OFFSET: ${{ github.event.inputs.utc_offset }}
        run: |
          # 1. Extract numeric ID after /document/
          DOC_ID=$(echo "$RAW_URL" | sed -nE 's|^https?://(www\.)?scribd\.com/document/([0-9]+).*|\2|p')
          if [ -z "$DOC_ID" ]; then
            echo "Error: Invalid Scribd URL"
            exit 1
          fi

          # 2. Parse +/-n(.5) offset in Node.js and format timestamp
          STAMP=$(node -e '
            const raw = (process.env.UTC_OFFSET || "0").replace(/^(GMT|UTC)/i, "").trim();
            if (!/^[+-]?\d+(\.5)?$/.test(raw)) {
              console.error("Invalid offset format. Use +/-n or +/-n.5 (e.g., +8, -5, +5.5)");
              process.exit(1);
            }
            const hours = parseFloat(raw);
            const d = new Date(Date.now() + hours * 3600000);
            const p = n => String(n).padStart(2, "0");
            console.log(`${p(d.getUTCDate())}/${p(d.getUTCMonth()+1)}/${d.getUTCFullYear()} (${p(d.getUTCHours())}:${p(d.getUTCMinutes())})`);
          ')

          RELEASE_TITLE="Release ${STAMP}"
          OUT_FILE=$(echo "${RELEASE_TITLE}.html" | tr '/:' '-')

          echo "Fetching: https://scribd.com{DOC_ID}/content"
          echo "Release Title: ${RELEASE_TITLE}"
          echo "Output File: ${OUT_FILE}"

          # 3. Save single-file HTML
          npx single-file-cli "https://scribd.com{DOC_ID}/content" "$OUT_FILE" \
            --browser-executable-path=/usr/bin/google-chrome \
            --browser-args='["--no-sandbox"]' \
            --load-deferred-images=true

          echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"
          echo "OUT_FILE=$OUT_FILE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_URL: ${{ github.event.inputs.scribd_url }}
        run: |
          gh release create "release-${{ github.run_id }}" \
            "$OUT_FILE" \
            --title "${RELEASE_TITLE}" \
            --notes "Archived from: ${RAW_URL}"
